services:
  postgres:
    image: postgres:17-alpine
    container_name: pkstt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pkstt}
      POSTGRES_USER: ${POSTGRES_USER:-pkstt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pkstt} -d ${POSTGRES_DB:-pkstt}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pkstt-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-pkstt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pkstt}?sslmode=disable"
      STATIC_SYNC_INTERVAL: ${STATIC_SYNC_INTERVAL:-6h}
      RT_POLL_INTERVAL: ${RT_POLL_INTERVAL:-10s}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-private}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-15}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      TIMEZONE: ${TIMEZONE:-Europe/Warsaw}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Bound to loopback only; expose publicly through Cloudflare Tunnel.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    tmpfs:
      - /tmp:size=128M,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - db-net
      - egress-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pkstt-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    networks:
      - egress-net

volumes:
  pgdata:

networks:
  db-net:
    internal: true
  egress-net:
